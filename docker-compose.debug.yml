services:
  mysql:
    image: mysql:5.7
    container_name: mall-debug-mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: mall
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mall-debug-mysql-data:/var/lib/mysql
      - ./document/sql/mall.sql:/docker-entrypoint-initdb.d/01-mall.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: mall-debug-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - mall-debug-redis-data:/data

  minio:
    image: minio/minio
    container_name: mall-debug-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mall-debug-minio-data:/data

  mongo:
    image: mongo:5
    container_name: mall-debug-mongo
    profiles: ["portal"]
    ports:
      - "27017:27017"
    volumes:
      - mall-debug-mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3.10.5-management
    container_name: mall-debug-rabbitmq
    profiles: ["portal"]
    environment:
      RABBITMQ_DEFAULT_USER: mall
      RABBITMQ_DEFAULT_PASS: mall
      RABBITMQ_DEFAULT_VHOST: /mall
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - mall-debug-rabbitmq-data:/var/lib/rabbitmq

  elasticsearch:
    image: elasticsearch:7.17.3
    container_name: mall-debug-elasticsearch
    profiles: ["search"]
    environment:
      discovery.type: single-node
      cluster.name: elasticsearch
      ES_JAVA_OPTS: -Xms512m -Xmx1024m
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - mall-debug-elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  mall-debug-mysql-data:
  mall-debug-redis-data:
  mall-debug-minio-data:
  mall-debug-mongo-data:
  mall-debug-rabbitmq-data:
  mall-debug-elasticsearch-data:
